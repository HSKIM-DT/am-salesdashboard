<title>AM사업부 영업 KPI 대시보드</title>

<style>
*{box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','맑은 고딕',sans-serif}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(120% 120% at 20% 0%,#25347A,#001A54 60%);color:#0E1530;padding:20px}
.box{position:relative;background:#fff;border-radius:20px;
 box-shadow:0 30px 70px -24px rgba(0,26,84,.6);padding:38px 34px;width:360px;max-width:100%;text-align:center}
.lock{width:52px;height:52px;margin:0 auto 14px;border-radius:15px;
 background:linear-gradient(150deg,#001A54,#5B6BA6);display:grid;place-items:center;
 box-shadow:0 8px 20px -6px rgba(0,26,84,.5),inset 0 1px 1px rgba(255,255,255,.25)}
.lock svg{width:24px;height:24px}
.box h1{margin:0 0 5px;font-size:19px;font-weight:800;color:#001A54;letter-spacing:-.02em}
.box p{margin:0 0 22px;font-size:12.5px;color:#8A90A8}
.box input{width:100%;padding:13px 15px;border:1px solid #C9CEDE;border-radius:11px;
 font-size:15px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
.box input:focus{outline:none;border-color:#5B6BA6;box-shadow:0 0 0 3px rgba(52,65,138,.14)}
.box button{width:100%;padding:13px;border:0;border-radius:11px;
 background:linear-gradient(90deg,#001A54,#25347A);color:#fff;font-size:15px;font-weight:800;cursor:pointer;
 transition:transform .1s,filter .2s}
.box button:hover{filter:brightness(1.08)}
.box button:active{transform:scale(.98)}
.box button:disabled{background:#9AA3BC;cursor:default}
.err{color:#D42B34;font-size:12.5px;margin-top:12px;min-height:16px;font-weight:600}
</style></head><body>

function u8(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function decrypt(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},
   km,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT));
 return new TextDecoder().decode(plain);
}
document.getElementById('f').addEventListener('submit',async(ev)=>{

 const b=document.getElementById('b'),e=document.getElementById('e');
 e.textContent='';b.disabled=true;b.textContent='복호화 중...';
 try{
  const html=await decrypt(document.getElementById('pw').value);
  document.open();document.write(html);document.close();
 }catch(_){

  b.disabled=false;b.textContent='열기';
 }
});
